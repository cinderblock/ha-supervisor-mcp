name: build

on:
  push:
    branches: [master]
    paths:
      - ha-supervisor-mcp/**
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - ha-supervisor-mcp/**
      - .github/workflows/build.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/cinderblock/ha-supervisor-mcp

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ha-supervisor-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: build (${{ matrix.arch }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' ha-supervisor-mcp/config.yaml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./ha-supervisor-mcp
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Run the image the way Supervisor would (options in /data) and check it
      # serves /mcp behind auth and that the bundled `ha` CLI runs.
      - name: Smoke test
        env:
          IMG: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          data=$(mktemp -d)
          echo '{"exec_enabled":true,"rotate_token":false,"allow_cidrs":["0.0.0.0/0"]}' > "$data/options.json"
          docker run -d --name smoke -p 9584:9584 -v "$data:/data" "$IMG"
          code=000
          for _ in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9584/mcp || true)
            [ "$code" = 401 ] && break
            sleep 1
          done
          docker logs smoke
          [ "$code" = 401 ] || { echo "expected 401 from /mcp, got $code" >&2; exit 1; }
          docker exec smoke ha --help > /dev/null
          token=$(sudo cat "$data/token")
          curl -sf http://127.0.0.1:9584/mcp \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"exec","arguments":{"command":"echo smoke-ok; ls /app/src"}}}' \
            | tee /dev/stderr | grep -q 'smoke-ok'
          docker rm -f smoke

  manifest:
    name: multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' ha-supervisor-mcp/config.yaml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        env:
          IMG: ${{ env.IMAGE }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMG:latest" \
            -t "$IMG:$VER" \
            "$IMG:$VER-amd64" \
            "$IMG:$VER-aarch64"
          docker buildx imagetools inspect "$IMG:latest"
