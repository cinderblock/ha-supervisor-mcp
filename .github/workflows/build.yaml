name: build

on:
  push:
    branches: [master]
    paths:
      - ha-ops-mcp/**
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - ha-ops-mcp/**
      - .github/workflows/build.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/cinderblock/ha-ops-mcp

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ha-ops-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: build (${{ matrix.arch }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' ha-ops-mcp/config.yaml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./ha-ops-mcp
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' ha-ops-mcp/config.yaml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        env:
          IMG: ${{ env.IMAGE }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMG:latest" \
            -t "$IMG:$VER" \
            "$IMG:$VER-amd64" \
            "$IMG:$VER-aarch64"
          docker buildx imagetools inspect "$IMG:latest"
